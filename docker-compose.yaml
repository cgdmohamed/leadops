services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=leadops
      - POSTGRES_USER=leadops
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadops -d leadops"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Coolify magic URL: routes the app domain to container port 3000
      - SERVICE_URL_APP_3000
      # Coolify magic URL: public origin, e.g. http://app-<uuid>.yourdomain.com
      - APP_URL=$SERVICE_URL_APP
      - DATABASE_URL=postgresql://leadops:${SERVICE_PASSWORD_POSTGRES}@db:5432/leadops
      - SESSION_SECRET=${SERVICE_HEX_64_APP}
      - INTEGRATION_ENCRYPTION_KEY=${SERVICE_HEX_64_APP}
      - ALLOW_SIGNUP=${ALLOW_SIGNUP:-false}
      - SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD}
      - SEED_ADMIN_NAME=${SEED_ADMIN_NAME}
      - SEED_WORKSPACE_NAME=${SEED_WORKSPACE_NAME}
      - SEED_WORKSPACE_CURRENCY=${SEED_WORKSPACE_CURRENCY:-USD}
      - SEED_WORKSPACE_TIMEZONE=${SEED_WORKSPACE_TIMEZONE:-UTC}
      - SMTP_URL=${SMTP_URL:-}
      - MAIL_FROM=${MAIL_FROM:-LeadOps <no-reply@leadops.local>}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_DEVELOPER_TOKEN=${GOOGLE_DEVELOPER_TOKEN:-}
      - META_CLIENT_ID=${META_CLIENT_ID:-}
      - META_CLIENT_SECRET=${META_CLIENT_SECRET:-}
      - META_OAUTH_SCOPES=${META_OAUTH_SCOPES:-ads_read,leads_retrieval,business_management}
      - TIKTOK_CLIENT_ID=${TIKTOK_CLIENT_ID:-}
      - TIKTOK_CLIENT_SECRET=${TIKTOK_CLIENT_SECRET:-}
      - TIKTOK_AUTH_URL=${TIKTOK_AUTH_URL:-https://ads.tiktok.com/marketing_api/auth}
      - SNAPCHAT_CLIENT_ID=${SNAPCHAT_CLIENT_ID:-}
      - SNAPCHAT_CLIENT_SECRET=${SNAPCHAT_CLIENT_SECRET:-}
      - SNAPCHAT_OAUTH_SCOPES=${SNAPCHAT_OAUTH_SCOPES:-snapchat-marketing-api offline_access}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  pgdata:
